<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>xterm.js terminal</title>
    <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
    <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <style>
      html, body { margin: 0; padding: 0; background: #1e1e1e; height: 100%; }
      #terminal { height: 100vh; padding: 4px; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <script>
      const term = new Terminal({ cursorBlink: true, theme: { background: '#1e1e1e' } });
      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.open(document.getElementById('terminal'));
      fitAddon.fit();
      term.focus();

      const ws = new WebSocket('ws://' + location.host);

      ws.onopen = () => {
        term.onData(data => ws.send(JSON.stringify({ type: 'input', data })));
      };

      ws.onmessage = (event) => {
        const { type, data } = JSON.parse(event.data);
        if (type === 'output') term.write(data);
      };

      ws.onclose = () => term.write('\r\n\x1B[31m[disconnected]\x1B[0m\r\n');

      window.addEventListener('resize', () => {
        fitAddon.fit();
        ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
      });
    </script>
  </body>
</html>
